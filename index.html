<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YouTube Queue</title>
  <meta name="build" content="staged-push-20260831" />
  <link rel="stylesheet" href="styles.css?v=20260930a">
</head>
<body>
  <header>
    <div id="topbar-roles" class="topbar-roles"></div>
    <div id="topbar-links" class="topbar-links"></div>
    <div id="theme-switcher" class="theme-switcher"></div>
  </header>

  <main>
    <aside class="side-bar left-bar">
      <div class="left-bar-panel">
        <div class="left-bar-header">
          <div class="left-bar-actions">
            <button id="add-link-btn" class="left-add left-link-add" title="Add link">#</button>
            <button id="add-page-btn" class="left-add" title="Add page">+</button>
            <button id="delete-page-items-btn" class="left-add left-delete-add" title="Delete mode for page items">x</button>
          </div>
        </div>
        <div id="left-nav" class="left-nav"></div>
        <div class="left-bar-footer">
          <button id="saved-pages-btn" class="left-note-btn saved-pages-btn" type="button" title="Open saved pages">📌</button>
        </div>
      </div>
    </aside>
    <section class="content-area">
      <div id="note-panel" class="note-panel hidden" aria-hidden="true">
        <button id="note-close-btn" class="note-close-btn" type="button" title="Close notepad" aria-label="Close notepad">×</button>
        <textarea id="note-textarea" class="note-textarea" spellcheck="false" placeholder="Write something..."></textarea>
      </div>
      <div id="sections"></div>
    </section>
    <aside class="side-bar right-bar">
      <div id="saved-links" class="saved-links"></div>
      <div class="right-bar-footer">
        <button id="shelf-add-btn" class="left-note-btn shelf-add-btn" type="button" title="Create saved shelf" aria-label="Create saved shelf">+</button>
        <button id="note-toggle-btn" class="left-note-btn" type="button" title="Open notepad" aria-label="Open notepad">📝</button>
      </div>
    </aside>
  </main>

  <template id="item-template">
    <div class="item">
      <img class="thumb" src="" alt="thumbnail">
      <div class="meta">
        <div class="title"></div>
        <div class="date"></div>
      </div>
    </div>
  </template>

  <div id="hold-action-dialog" class="hold-dialog hidden" aria-hidden="true">
    <div class="hold-dialog-backdrop"></div>
    <div class="hold-dialog-panel" role="dialog" aria-modal="true" aria-labelledby="hold-dialog-title">
      <h2 id="hold-dialog-title" class="hold-dialog-title">Manage</h2>
      <div class="hold-dialog-actions">
        <div id="hold-link-editor" class="hold-link-editor hidden">
          <label class="hold-link-field">
            <span>Title</span>
            <input id="hold-link-title-input" type="text" autocomplete="off">
          </label>
          <label class="hold-link-field">
            <span>Link</span>
            <input id="hold-link-url-input" type="url" autocomplete="off">
          </label>
        </div>
        <div id="hold-page-random-editor" class="hold-link-editor hidden">
          <label class="hold-link-field">
            <span>Playlist Link</span>
            <input id="hold-page-random-url-input" type="url" autocomplete="off">
          </label>
          <div class="hold-range-row">
            <label class="hold-link-field">
              <span>From</span>
              <input id="hold-page-range-start-input" type="number" min="1" step="1" inputmode="numeric">
            </label>
            <label class="hold-link-field">
              <span>To</span>
              <input id="hold-page-range-end-input" type="number" min="1" step="1" inputmode="numeric">
            </label>
          </div>
          <label class="hold-random-row">
            <input id="hold-page-reverse-checkbox" type="checkbox">
            <span>Reverse range order (start from top)</span>
          </label>
          <label class="hold-random-row">
            <input id="hold-page-random-order-checkbox" type="checkbox">
            <span>Random order (no repeats)</span>
          </label>
        </div>
        <label id="hold-random-row" class="hold-random-row hidden">
          <input id="hold-random-checkbox" type="checkbox">
          <span>Playlist sequence</span>
        </label>
        <button id="hold-edit-btn" type="button">Edit</button>
        <button id="hold-move-up-btn" type="button">Move up</button>
        <button id="hold-move-down-btn" type="button">Move down</button>
        <button id="hold-delete-btn" type="button" class="danger">Delete</button>
      </div>
      <button id="hold-exit-btn" type="button" class="hold-exit-btn">Exit</button>
    </div>
  </div>

  <div id="carb-item-dialog" class="hold-dialog hidden" aria-hidden="true">
    <div class="hold-dialog-backdrop"></div>
    <div class="hold-dialog-panel carb-item-dialog-panel" role="dialog" aria-modal="true" aria-labelledby="carb-item-dialog-title">
      <h2 id="carb-item-dialog-title" class="hold-dialog-title">Add Food Items</h2>
      <div class="carb-color-picker" id="carb-color-picker"></div>
      <div class="carb-value-rows" id="carb-value-rows"></div>
      <div class="hold-dialog-actions">
        <button id="carb-item-save-btn" type="button">Save</button>
        <button id="carb-item-cancel-btn" type="button" class="hold-exit-btn">Cancel</button>
      </div>
    </div>
  </div>

  <div id="gym-note-dialog" class="hold-dialog hidden" aria-hidden="true">
    <div class="hold-dialog-backdrop"></div>
    <div class="hold-dialog-panel gym-note-dialog-panel" role="dialog" aria-modal="true" aria-labelledby="gym-note-dialog-title">
      <h2 id="gym-note-dialog-title" class="hold-dialog-title">Gym Note</h2>
      <textarea id="gym-note-textarea" class="gym-note-textarea" placeholder="Write a note for this video..."></textarea>
      <div class="hold-dialog-actions">
        <button id="gym-note-save-btn" type="button">Save note</button>
        <button id="gym-note-cancel-btn" type="button" class="hold-exit-btn">Cancel</button>
      </div>
    </div>
  </div>

  <div id="music-item-dialog" class="hold-dialog hidden" aria-hidden="true">
    <div class="hold-dialog-backdrop"></div>
    <div class="hold-dialog-panel music-dialog-panel" role="dialog" aria-modal="true" aria-labelledby="music-item-dialog-title">
      <h2 id="music-item-dialog-title" class="hold-dialog-title">Music video</h2>
      <label class="hold-link-field">
        <span>Start at</span>
        <input id="music-start-time-input" type="text" inputmode="text" autocomplete="off" placeholder="0:00" aria-label="Start time">
      </label>
      <label class="hold-random-row music-favorite-row">
        <input id="music-favorite-checkbox" type="checkbox">
        <span>Favorite</span>
      </label>
      <div class="hold-dialog-actions music-dialog-actions">
        <button id="music-item-save-btn" type="button">Save</button>
        <button id="music-item-cancel-btn" type="button" class="hold-exit-btn">Cancel</button>
      </div>
    </div>
  </div>

  <div id="music-player-overlay" class="music-player-overlay hidden" aria-hidden="true">
    <div class="music-player-backdrop"></div>
    <section class="music-player-panel" role="dialog" aria-modal="true" aria-labelledby="music-player-title">
      <button id="music-player-close-btn" class="music-player-close" type="button" title="Close video" aria-label="Close video">×</button>
      <h2 id="music-player-title" class="music-player-title"></h2>
      <div class="music-player-frame-wrap">
        <iframe id="music-player-frame" title="Music video player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
      </div>
      <div class="music-player-controls">
        <button id="music-player-favorite-btn" class="music-player-favorite" type="button"></button>
        <label class="music-player-time-field">
          <span>Start at</span>
          <input id="music-player-time-input" type="text" inputmode="text" autocomplete="off" placeholder="0:00" aria-label="Start time">
        </label>
        <button id="music-player-start-btn" type="button">Start</button>
      </div>
    </section>
  </div>

  <script src="app.js?v=20260930a"></script>
</body>
</html>
